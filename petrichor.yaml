# Set up for Petrichor
# No performance_report_dir, unlike racs-all-configuration: the flint in use
# hands every key here to DaskTaskRunner, which does not take it
cluster_class: "dask_jobqueue.SLURMCluster"
cluster_kwargs:
    cores: 1
    processes: 1
    job_cpu: 30
    name: 'flint-avast-worker'
    memory: "120GB"
    account: 'OD-241659'
    #queue: 'workq'
    walltime: '0-24:00:00'
    job_extra_directives:
      - '--no-requeue'
      - '--exclude=c105,c102,c251,c135'
    # interface for the workers
    interface: "ib0"
    log_directory: 'flint_logs'
    python: "${FLINT_PYTHON}"
    job_script_prologue:
        - "set -x"
        - "export OMP_NUM_THREADS=${SLURM_CPUS_ON_NODE}"
        - "source ./flint_worker_env.sh"
    #local_directory: $LOCALDIR
    silence_logs: 'info'
adapt_kwargs:
    minimum: 1
    maximum: 38
    # Check every 30s and scale down only after four checks agree: scaling down a
    # second after scaling up cancels a job whose worker still comes up and takes a task
    interval: "30s"
    wait_count: 4
