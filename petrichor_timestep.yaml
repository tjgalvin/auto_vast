# Set up for Petrichor
cluster_class: "dask_jobqueue.SLURMCluster"
cluster_kwargs:
    cores: 10
    processes: 1
    job_cpu: 30
    name: 'flint-avast-worker_timestep'
    memory: "120GB"
    account: 'OD-241659'
    #queue: 'workq'
    walltime: '0-24:00:00'
    job_extra_directives:
      - '--no-requeue'
    # interface for the workers
    interface: "ib0"
    log_directory: 'flint_logs'
    # Import dask_jobqueue as the worker starts, on its main thread, rather than
    # while deserialising a large initial context, which triggers a worker bug.
    # Drop once a release with the fix ships
    worker_extra_args:
      - "--preload"
      - "dask_jobqueue"
    python: "${FLINT_PYTHON}"
    job_script_prologue:
        - "set -x"
        - "export OMP_NUM_THREADS=${SLURM_CPUS_ON_NODE}"
        - "export FLINT_APPTAINER_MODULE=apptainer/1.3.3"
        - "source ./flint_worker_env.sh"
    #local_directory: $LOCALDIR
    silence_logs: 'info'
# flint writes each flow run's dask performance report here, beside the worker logs
performance_report_dir: flint_logs
adapt_kwargs:
    minimum: 1
    maximum: 32
    # Check every 30s and scale down only after four checks agree: scaling down a
    # second after scaling up cancels a job whose worker still comes up and takes a task
    interval: "30s"
    wait_count: 4
